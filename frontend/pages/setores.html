<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensus | Setores</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://unpkg.com/lucide-static@latest/font/lucide.css" rel="stylesheet">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar"></div>

    <main class="main-content">
      <div id="topbar"></div>

      <section class="page-grid">
        <div class="card" id="cadastroSetor">
          <h2 id="tituloFormularioSetor">Cadastrar Setor</h2>
          <p style="color:#64748b; margin: 8px 0 22px;">
            Informe o ambiente que será avaliado nas auditorias 5S.
          </p>
          <input type="hidden" id="sectorId">

          <form id="sectorForm">
            <label for="sectorName"><strong>Nome do Setor</strong></label>
            <input 
              type="text" 
              id="sectorName" 
              class="form-control" 
              placeholder="Ex: Almoxarifado, Recepção, Escritório..."
              required
            >

            <label for="sectorAuditor"><strong>Auditor responsável</strong></label>
            <select id="sectorAuditor" class="form-control" required>
              <option value="">Carregando auditores...</option>
            </select>

            <label for="sectorPeriodicity"><strong>Periodicidade das auditorias</strong></label>
            <select id="sectorPeriodicity" class="form-control" required>
              <option value="semanal">Semanal</option>
              <option value="quinzenal">Quinzenal</option>
              <option value="mensal" selected>Mensal</option>
              <option value="bimestral">Bimestral</option>
              <option value="trimestral">Trimestral</option>
              <option value="semestral">Semestral</option>
              <option value="anual">Anual</option>
            </select>

            <label for="sectorDesc"><strong>Descrição</strong></label>
            <textarea 
              id="sectorDesc" 
              class="form-control" 
              placeholder="Descreva a finalidade e características do setor..."
              rows="5"
              required
            ></textarea>

            <div style="display:flex; gap:10px;">
              <button type="submit" class="btn-primary" id="botaoSalvarSetor" style="flex:1;">
                Salvar Setor
              </button>
              <button type="button" class="btn-outline" id="botaoCancelarEdicao" style="display:none;">
                Cancelar
              </button>
            </div>
          </form>
        </div>

        <div>
          <h2 class="section-title" style="text-align:left; margin-top:0;">
            Setores Cadastrados
          </h2>

          <div id="listaSetores" class="sector-grid">
            <div class="card">
              <p>Carregando setores...</p>
            </div>
          </div>
        </div>
      </section>

      <p class="footer-text">
        © 2026 Sensus 5S • Brenda, Wesllys e Saranna • TCC ADS UEMA
      </p>
    </main>
  </div>

  <script src="../js/components.js"></script>
  <script>
    renderSidebar("setores");
    renderTopbar(
      "Setores",
      "Gerencie os ambientes avaliados nas auditorias 5S.",
      "+ Novo Setor",
      "#cadastroSetor"
    );
  </script>
  <script src="../js/setores.js"></script>
</body>
</html>
